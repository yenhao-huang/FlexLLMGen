[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexllmgen"
version = "0.1.7"
description = "Running large language models like OPT-175B/GPT-3 on a single GPU. Focusing on high-throughput large-batch generation."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=1.12", "transformers>=4.24",
    "numpy", "tqdm", "pulp", "attrs",
]

[project.optional-dependencies]
qwen = [
    "torch>=2.9,<2.10; python_version >= '3.10'",
    "transformers>=5.8.0; python_version >= '3.10'",
    "accelerate>=1.12; python_version >= '3.10'",
    "bitsandbytes>=0.49; python_version >= '3.10'",
    "torchao>=0.15,<0.16; python_version >= '3.10'",
    "safetensors>=0.6; python_version >= '3.10'",
]
sol = [
    "openai>=1.66; python_version >= '3.10'",
]

[project.scripts]
flexllmgen-hf = "flexllmgen.hf_opt:main"

[project.urls]
"Homepage" = "https://github.com/FMInference/FlexLLMGen"
"Bug Tracker" = "https://github.com/FMInference/FlexLLMGen/issues"

[tool.setuptools.packages.find]
exclude = ["benchmark*", "dist*", "playground*", "scripts*"]

[tool.wheel]
exclude = ["benchmark*", "dist*", "playground*", "scripts*"]
